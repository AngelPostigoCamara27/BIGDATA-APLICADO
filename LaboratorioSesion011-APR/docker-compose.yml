services:
  hadoop:
    image: apache/hadoop:3.4.0
    container_name: hadoop-lab
    hostname: hadoop-lab
    ports:
      - "9870:9870"
      - "8088:8088"
    volumes:
      - ./datos:/workspace
    command: ["/bin/bash", "-c", "sudo /usr/sbin/sshd && /opt/hadoop/sbin/start-dfs.sh && /opt/hadoop/sbin/start-yarn.sh && tail -f /dev/null"]